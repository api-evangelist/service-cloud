name: Salesforce Service Cloud APIs
description: >-
  Salesforce Service Cloud is the customer-service and contact-centre product on the Salesforce
  Platform, and its API surface is the Salesforce Platform API applied to service objects — Case,
  CaseComment, Knowledge articles, LiveChatTranscript, MessagingSession, entitlements and
  omni-channel routing — reached through the REST, SOAP, Bulk and Composite APIs. Alongside that
  record layer Salesforce ships purpose-built runtimes with their own contracts: an OpenAPI 3.0
  document for the Einstein Bots Runtime API, a gRPC/protobuf contract for the Pub/Sub event API,
  a CometD Streaming API, and generally available hosted MCP servers that expose the sObject layer
  to AI agents over OAuth. There is no single global API host — every call is made against the
  customer's own org at the instance_url returned with the OAuth token, on API version 67.0
  (Summer '26). Authentication is OAuth 2.0 only; Salesforce issues no API keys.
