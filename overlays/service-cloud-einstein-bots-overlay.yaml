    x-note: >-
      The published spec carries no contact, termsOfService or license. These are Salesforce's own
      published pages (both probed 200 on 2026-08-27), not invented values.
  - target: $.paths['/v5.3.0/bots/{bot-id}/sessions'].post
    update:
      x-agentic-access:
        action-class: create
        consequence: >-
          Opens a billable bot conversation session and may enqueue a live-agent escalation.
        reversible: false
        reversal-note: A session cannot be un-started; call endSession to close it.
        escalation: none
      x-idempotency:
        supported: false
        note: >-
          No Idempotency-Key on this surface. ExternalSessionKey in the InitMessageEnvelope is the
          caller's own correlation key and does NOT deduplicate a repeated startSession.
  - target: $.paths['/v5.3.0/sessions/{session-id}/messages'].post
    update:
      x-agentic-access:
        action-class: update
        consequence: Sends a message into a live bot conversation a human may be reading.
        reversible: false
      x-ordering:
        note: sequenceId must increase monotonically within a session; inReplyToMessageId threads replies.
  - target: $.paths['/v5.3.0/sessions/{session-id}'].delete
    update:
      x-agentic-access:
        action-class: delete
        consequence: Ends the bot session. Any in-flight escalation is abandoned.
        reversible: false
        reversal-note: >-
          No resume. Per conventions/service-cloud-conventions.yml the only recourse is a new
          startSession, which loses conversation state.
  - target: $.paths['/status'].get
    update:
      x-agentic-access:
        action-class: read
        consequence: none
        reversible: true
      x-unauthenticated: true
      x-note: 'Verified anonymous: GET https://runtime-api-na-west.prod.chatbots.sfdc.sh/status → 200 {"status":"UP"} on 2026-08-27.'
  - target: $.paths['/versions'].get
    update:
      x-agentic-access:
        action-class: read
        consequence: none
        reversible: true
      x-unauthenticated: true
      x-note: >-
        Verified anonymous on 2026-08-27; returns 4.0.0 DEPRECATED and 5.0.0-5.3.0 ACTIVE. This is
        the version-lifecycle discovery endpoint an agent should call before pinning a path version.
  - target: $.servers
    update:
      x-note: >-
        Six regional hosts on Salesforce's prod.chatbots.sfdc.sh operational domain. Pick the region
        the org resides in; there is no global anycast host.
