      - {name: session-id, where: 'path parameter of continueSession and endSession'}
      - {name: ExternalSessionKey, note: 'caller-supplied key that ties a bot session to the consumer''s own conversation'}
      - {name: sequenceId, note: 'monotonic message ordering within a session'}
      - {name: inReplyToMessageId, note: 'threads a client message to the bot message it answers'}
      - {name: requestId, note: 'UUID on every error response; the support trace handle'}
  - name: Service Cloud record model
    source: >-
      Object names as exposed by Salesforce's hosted MCP tools and named in the REST API and
      Object Reference guides. No published static schema; derive per org with
      GET /services/data/v67.0/sobjects/{SObject}/describe.
    confidence: names-only
    entities:
      - name: Case
        role: the central Service Cloud record
        relationships:
          - {type: has_many, target: CaseComment, via: ParentId}
          - {type: has_many, target: CaseHistory, via: CaseId}
          - {type: has_many, target: EmailMessage, via: ParentId}
          - {type: belongs_to, target: Account, via: AccountId}
          - {type: belongs_to, target: Contact, via: ContactId}
          - {type: belongs_to, target: User, via: OwnerId, note: 'OwnerId may also be a Queue (Group) id'}
          - {type: belongs_to, target: Entitlement, via: EntitlementId}
        note: >-
          The Sforce-Auto-Assign request header decides whether assignment rules fire on create —
          the difference between a quiet API write and a routed, notified, SLA-clocked case.
      - name: Knowledge__kav
        role: knowledge article version
        note: >-
          Article types are org-specific; the versioned object name carries the __kav suffix and
          articles move through Draft / Online / Archived publish states.
      - name: LiveChatTranscript
        role: record of a Live Agent chat
      - name: MessagingSession
        role: record of a Messaging for In-App and Web conversation
      - name: ServiceAppointment
        role: field-service work appointment
      - name: Entitlement
        role: SLA entitlement attached to an account or asset
        relationships: [{type: has_many, target: Case, via: EntitlementId}]
  - name: Event model
    source: grpc/service-cloud-pubsub-api.proto
    entities:
      - name: TopicInfo
        fields_observed: [topic_name, tenant_guid, can_publish, can_subscribe, schema_id, rpc_id]
        relationships: [{type: has_one, target: SchemaInfo, via: schema_id}]
      - name: SchemaInfo
        note: Carries the Avro schema JSON for a topic. Events are Avro-encoded bytes, not JSON.
      - name: ProducerEvent / ConsumerEvent
        note: Wire records carried by Publish/PublishStream and Subscribe/ManagedSubscribe.
