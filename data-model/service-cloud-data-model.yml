note: >-
  TWO DISCONNECTED MODELS. The only published contract is the Einstein Bots conversational envelope,
  which is a MESSAGE model, not the Service Cloud record model. The record model (Case, Knowledge,
  chat transcripts) is real and documented in prose, but has no published static schema — an org
  generates its own describe/OAS output behind authentication. The record section below therefore
  carries object names and relationships Salesforce documents, and NO invented fields.
