note: >-
  The two surfaces in this repo barely overlap, and that IS the finding. The only OpenAPI
  Salesforce publishes for a Service Cloud surface is the Einstein Bots Runtime API; the hosted
  MCP tools sit on top of the sObject REST layer, whose OpenAPI is generated PER ORG and is not
  published as a static document. Every crosswalk row below is therefore mapped by documented
  semantics against the REST API Developer Guide's named resources, not against operationIds in
  a spec held in this repo — confidence is set accordingly and no operationId is invented.
